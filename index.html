<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bell schedule</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=Fredoka:wght@500;600&family=Orbitron:wght@600;700&display=swap">
<style>
:root{--bg:#f2f5f9;--ink:#14213d;--muted:#5b6b82;--line:#d3dce9;--hl:#fff1c7;--col:#e8eef6;--band:#14213d;--bandink:#f4f7fb;--brass:#f5b83d;--onbrass:#14213d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--ink:#e8eef6;--muted:#9aaac0;--line:#27364d;--hl:#4a3a10;--col:#16212f;--band:#1a2a44}}
:root[data-theme="dark"]{--bg:#0e1621;--ink:#e8eef6;--muted:#9aaac0;--line:#27364d;--hl:#4a3a10;--col:#16212f;--band:#1a2a44}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
.hero{background:var(--band);color:var(--bandink);padding:28px 20px 30px}
.wrap{max-width:860px;margin:0 auto}
.day{margin:0;font-size:1.05rem;opacity:.75}
h1{margin:6px 0 0;font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-weight:700;font-size:clamp(2.4rem,9vw,4rem);line-height:1.05}
.clock{font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-weight:700;font-size:clamp(5rem,26vw,11rem);line-height:.95;color:var(--brass);font-variant-numeric:tabular-nums;margin:4px 0 0;letter-spacing:-.01em}
.sub{margin:4px 0 18px;font-size:1.15rem}
.bar{height:12px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--brass)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 0;opacity:.85}
.meta p{margin:0}
main{padding:28px 20px 40px}
h2{font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-size:1.9rem;margin:0 0 4px}
.note{margin:0 0 14px;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td,tr:last-child th{border-bottom:0}
thead th{font-weight:600;border-bottom:2px solid var(--line)}
tbody th{font-weight:600}
td{font-variant-numeric:tabular-nums}
.today{background:var(--col)}
td.now{background:var(--hl);font-weight:600;box-shadow:inset 4px 0 0 var(--brass)}
.days{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.days button{font:inherit;color:var(--bandink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 16px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--onbrass);font-weight:600}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.fx{margin-top:40px}
.sws{display:flex;gap:12px;flex-wrap:wrap}
.sw{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 18px 8px 10px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sw i{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:transform .2s,background .2s}
.sw[aria-checked="true"] i{background:var(--brass)}
.sw[aria-checked="true"] i::after{transform:translateX(16px);background:#14213d}
body{transition:background .5s}
.chart{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.sched{border:1px solid var(--line);border-radius:8px;padding:14px 14px 8px}
.sched.today{background:var(--col);border-color:var(--brass);box-shadow:inset 0 4px 0 var(--brass)}
.sched h3{margin:0;font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-size:1.4rem}
.dates{margin:2px 0 8px;font-size:.9rem;color:var(--muted)}
.sched table{width:100%;min-width:0;border-collapse:collapse}
.sched th,.sched td{padding:6px 0;white-space:nowrap;border-bottom:1px solid var(--line);text-align:left}
.sched td{text-align:right;font-variant-numeric:tabular-nums}
.sched tr:last-child th,.sched tr:last-child td{border-bottom:0}
.sched tr.now{background:var(--hl);font-weight:600;box-shadow:-8px 0 0 var(--hl),8px 0 0 var(--hl)}
body[data-skin="pink"] .sched{border-radius:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 16px;flex-wrap:wrap;margin:0 0 20px}
.top .days{margin:0}
.tnow{margin-left:auto;font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;font-size:1.7rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.pill{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
.pill[aria-checked="true"]{background:var(--brass);border-color:var(--brass);color:var(--onbrass);font-weight:600}
.hue{display:flex;align-items:center;gap:12px;margin-top:16px}
.hue[hidden]{display:none}
.hue input{flex:1;max-width:360px;height:14px;border-radius:7px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,hsl(0 70% 50%),hsl(60 70% 50%),hsl(120 70% 45%),hsl(180 70% 45%),hsl(240 70% 55%),hsl(300 70% 50%),hsl(360 70% 50%))}
.hue input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer}
.hue input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer}
body[data-skin="pink"]{--bg:#fff2f8;--ink:#5c2243;--muted:#a65a84;--line:#f6c9de;--hl:#ffdcec;--col:#ffe7f2;--band:#ff7fb8;--bandink:#fff;--brass:#fff4b8;--onbrass:#7a1f50;font-family:Fredoka,Barlow,system-ui,sans-serif}
body[data-skin="pink"] h1,body[data-skin="pink"] h2,body[data-skin="pink"] .clock,body[data-skin="pink"] .tnow{font-family:Fredoka,"Comic Sans MS",system-ui,sans-serif;font-weight:600}
body[data-skin="pink"] .hero{border-radius:0 0 40px 40px;background:radial-gradient(circle at 12px 12px,rgba(255,255,255,.3) 3px,transparent 4px) 0 0/28px 28px,var(--band)}
body[data-skin="pink"] .clock{color:#fff;text-shadow:0 5px 0 rgba(170,40,110,.35)}
body[data-skin="pink"] .scroll{border-radius:20px}
body[data-skin="pink"] .bar,body[data-skin="pink"] .bar span{border-radius:8px}
body[data-skin="trans"]{--bg:#f4fbff;--ink:#26304f;--muted:#5c6c8a;--line:#cfe8f5;--hl:#fde0e8;--col:#e4f5fd;--bandink:#1d2b4f;--brass:#2a3a6b;--onbrass:#fff}
body[data-skin="trans"] .hero{background:linear-gradient(180deg,#5bcefa 0 20%,#f5a9b8 20% 40%,#fff 40% 60%,#f5a9b8 60% 80%,#5bcefa 80%)}
body[data-skin="trans"] .bar{background:rgba(30,40,90,.2)}
body[data-skin="trans"] .days button{background:rgba(255,255,255,.55);border-color:rgba(30,40,90,.35)}
body[data-skin="trans"] .days button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--onbrass)}
body[data-skin="sunset"]{--bg:#ffe9d9;--ink:#fff;--muted:rgba(255,255,255,.78);--line:rgba(255,255,255,.3);--hl:rgba(255,211,107,.3);--col:rgba(255,255,255,.14);--bandink:#fff;--brass:#ffd36b;--onbrass:#4a1530;background:linear-gradient(180deg,#d94420,#b3195e 45%,#4b2a8a)}
body[data-skin="sunset"] .hero{background:transparent}
body[data-skin="sunset"] h1,body[data-skin="sunset"] .clock,body[data-skin="sunset"] .sub{text-align:center}
body[data-skin="sunset"] .clock{color:#fff;text-shadow:0 2px 22px rgba(110,15,60,.8)}
.hero{position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.sun{display:none;position:absolute;left:50%;top:58%;--s:clamp(200px,60vw,380px);width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ffa24a 0,#ff7a35 45%,#f0502a 68%,rgba(240,80,42,0) 72%);box-shadow:0 0 90px 30px rgba(255,170,60,.5);animation:bob 6s ease-in-out infinite alternate,glow 3s ease-in-out infinite alternate}
.sun::before{content:"";position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(rgba(255,205,125,.32) 0 5deg,transparent 5deg 14deg);-webkit-mask:radial-gradient(circle,#000 28%,transparent 68%);mask:radial-gradient(circle,#000 28%,transparent 68%);animation:spin 50s linear infinite}
body[data-skin="sunset"] .sun{display:block}
@keyframes bob{from{transform:translateY(-12px)}to{transform:translateY(12px)}}
@keyframes glow{from{opacity:.8}to{opacity:1}}
body.fx-comic,body.fx-comic *{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive,sans-serif!important}
body.fx-comic .clock{font-size:clamp(3.5rem,16vw,8rem)!important}
body.fx-comic h1{font-size:clamp(2rem,7vw,3.2rem)!important}
@media (prefers-reduced-motion:reduce){.sun,.sun::before{animation:none}}
body[data-skin="forest"]{--bg:#dfeadb;--ink:#eef7ea;--muted:rgba(238,247,234,.75);--line:rgba(238,247,234,.22);--hl:rgba(201,226,101,.25);--col:rgba(255,255,255,.08);--bandink:#f1f7ef;--brass:#c9e265;--onbrass:#1f3a14;background:linear-gradient(180deg,#1f4d3a,#10291e 55%,#0a1d15)}
body[data-skin="forest"] .hero{background:transparent}
body[data-skin="forest"] .clock{text-shadow:0 2px 18px rgba(0,20,10,.7)}
.forest,.arcade{display:none;position:absolute;inset:0;pointer-events:none}
body[data-skin="forest"] .forest,body[data-skin="neon"] .arcade{display:block}
body[data-skin="forest"] h1,body[data-skin="forest"] .clock,body[data-skin="forest"] .sub,body[data-skin="neon"] h1,body[data-skin="neon"] .clock,body[data-skin="neon"] .sub{text-align:center}
.t{position:absolute;bottom:0;width:calc(var(--h)*.6);height:var(--h);background:#1a4a35;clip-path:polygon(50% 0,82% 38%,66% 38%,94% 72%,58% 72%,58% 100%,42% 100%,42% 72%,6% 72%,34% 38%,18% 38%);transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate;animation-delay:var(--d)}
.t.f{background:#0b231a}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#e8ff7a;box-shadow:0 0 10px 3px rgba(232,255,122,.7);opacity:0;animation:fly 7s ease-in-out infinite;animation-delay:var(--d)}
@keyframes fly{0%{transform:translate(0,0);opacity:0}20%{opacity:1}50%{transform:translate(18px,-22px);opacity:.35}80%{opacity:1}100%{transform:translate(-14px,-44px);opacity:0}}
.nsun{position:absolute;left:50%;top:46%;--s:clamp(180px,48vw,300px);width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:linear-gradient(180deg,#ffe14d 0,#ff2bd6 72%);-webkit-mask-image:linear-gradient(180deg,#000 0 50%,transparent 50% 54%,#000 54% 63%,transparent 63% 68%,#000 68% 76%,transparent 76% 82%,#000 82% 89%,transparent 89% 94%,#000 94%);mask-image:linear-gradient(180deg,#000 0 50%,transparent 50% 54%,#000 54% 63%,transparent 63% 68%,#000 68% 76%,transparent 76% 82%,#000 82% 89%,transparent 89% 94%,#000 94%);opacity:.7;animation:nglow 2.5s ease-in-out infinite alternate}
@keyframes nglow{from{opacity:.5}to{opacity:.85}}
.ngrid{position:absolute;left:-50%;right:-50%;bottom:0;height:60%;background-image:linear-gradient(rgba(255,43,214,.75) 1px,transparent 1px),linear-gradient(90deg,rgba(255,43,214,.75) 1px,transparent 1px);background-size:44px 44px;transform:perspective(260px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 25%,transparent);mask-image:linear-gradient(to top,#000 25%,transparent);animation:gridmove 1.2s linear infinite}
@keyframes gridmove{from{background-position:0 0}to{background-position:0 44px}}
@media (prefers-reduced-motion:reduce){.t,.nsun,.ngrid{animation:none}.ff{animation:none;opacity:.8}}
body[data-skin="neon"]{--bg:#0b0820;--ink:#eaf2ff;--muted:#9a90d0;--line:#2e2660;--hl:#33145a;--col:#150f33;--bandink:#eaf2ff;--brass:#00f0ff;--onbrass:#06122a;background:linear-gradient(180deg,#1b0a52,#120a3a 40%,#0b0820)}
body[data-skin="neon"] .hero{background:transparent;border-bottom:3px solid #ff2bd6;box-shadow:0 8px 40px rgba(255,43,214,.35)}
body[data-skin="neon"] h1,body[data-skin="neon"] h2,body[data-skin="neon"] .clock,body[data-skin="neon"] .tnow{font-family:Orbitron,Impact,sans-serif;font-weight:700}
body[data-skin="neon"] h1{font-size:clamp(1.6rem,7vw,3rem)}
body[data-skin="neon"] .clock{font-size:clamp(3rem,13vw,7rem);letter-spacing:.02em;text-shadow:0 0 26px rgba(0,240,255,.7),0 2px 8px rgba(0,0,0,.85)}
body.fx-dark{--bg:#07070f;--ink:#e8eef6;--muted:#9aaac0;--line:#2a2a44;--hl:#4a3a10;--col:#12122a;--band:#0d0d22}
.fxl{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .6s;z-index:5}
body.fx-fog .fog,body.fx-rave .rave{opacity:1}
.fog i{position:absolute;left:-30%;width:90%;height:45%;border-radius:50%;background:radial-gradient(closest-side,rgba(205,215,235,.5),transparent);filter:blur(30px);animation:drift 22s ease-in-out infinite alternate}
.fog i:nth-child(1){top:-5%}
.fog i:nth-child(2){top:30%;animation-duration:31s;animation-direction:alternate-reverse}
.fog i:nth-child(3){top:62%;animation-duration:26s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(60%)}}
.rave{mix-blend-mode:screen}
.rave b{position:absolute;top:-60vmax;width:120vmax;height:120vmax;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 18deg,rgba(255,40,200,.6) 22deg 30deg,transparent 36deg 120deg,rgba(40,220,255,.6) 124deg 132deg,transparent 138deg 240deg,rgba(120,255,80,.5) 244deg 252deg,transparent 258deg);animation:spin 9s linear infinite,hue 6s linear infinite}
.rave b:nth-child(1){left:-60vmax}
.rave b:nth-child(2){right:-60vmax;animation-direction:reverse,normal}
.rave::after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to top,rgba(255,40,200,.4),transparent);animation:pulse 1.4s ease-in-out infinite alternate,hue 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hue{from{filter:blur(14px) hue-rotate(0deg)}to{filter:blur(14px) hue-rotate(360deg)}}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
@keyframes tc{0%,100%{color:#ff5d8f}20%{color:#ffd23f}40%{color:#3ef0a0}60%{color:#45d0ff}80%{color:#b68cff}}
body.fx-text .hero,body.fx-text main,body.fx-text .clock,body.fx-text .note,body.fx-text .sw{animation:tc 8s linear infinite}
body.fx-text .clock{animation-delay:-2s}
body.fx-text main{animation-delay:-4s}
body.fx-rave .clock{text-shadow:0 0 28px currentColor}
@media (prefers-reduced-motion:reduce){.fog i,.rave b,.rave::after,body.fx-text .hero,body.fx-text main,body.fx-text .clock,body.fx-text .note,body.fx-text .sw{animation:none}}
</style>
</head>
<body>
<section class="hero"><div class="sun" aria-hidden="true"></div>

<div class="arcade" aria-hidden="true"><i class="nsun"></i><i class="ngrid"></i></div><div class="wrap">

<script>
var T=function(s){var p=s.split(":"),h=+p[0],m=+p[1];if(h<7)h+=12;return h*60+m};
var mk=function(a){return a.map(function(x){return{n:x[0],s:T(x[1]),e:T(x[2])}})};
var SCH={
mf:mk([["Period 0","7:19","8:09"],["Period 1","8:14","9:04"],["Period 2","9:08","9:58"],["Nutrition","9:58","10:08"],["Advisory","10:12","10:32"],["Period 3","10:32","11:22"],["Period 4","11:26","12:16"],["Lunch","12:16","12:51"],["Period 5","12:55","1:45"],["Period 6","1:49","2:39"]]),
tt:mk([["Period 0","7:19","8:07"],["Period 1","8:14","9:02"],["Period 2","9:06","9:54"],["Nutrition","9:54","10:04"],["Tutorial","10:08","10:38"],["Period 3","10:42","11:30"],["Period 4","11:34","12:22"],["Lunch","12:22","12:55"],["Period 5","0:59","1:47"],["Period 6","1:51","2:39"]]),
w:mk([["Period 0","7:19","7:59"],["Period 1","9:14","9:54"],["Period 2","9:58","10:38"],["Nutrition","10:38","10:48"],["Advisory","10:52","11:12"],["Period 3","11:12","11:52"],["Period 4","11:56","12:36"],["Lunch","12:36","1:11"],["Period 5","1:15","1:55"],["Period 6","1:59","2:39"]])
};
SCH.ea=mk([["Period 0","7:19","7:59"],["Period 1","8:14","8:55"],["Period 2","8:59","9:40"],["Nutrition","9:40","9:50"],["Advisory","9:54","10:19"],["Period 3","10:19","11:00"],["Period 4","11:04","11:45"],["Lunch","11:45","12:15"],["Period 5","12:19","0:59"],["Period 6","1:03","1:43"]]);
SCH.et=mk([["Period 0","7:19","7:57"],["Period 1","8:14","8:52"],["Period 2","8:56","9:34"],["Nutrition","9:34","9:44"],["Tutorial","9:48","10:18"],["Period 3","10:22","11:00"],["Period 4","11:04","11:42"],["Lunch","11:42","12:15"],["Period 5","12:19","12:57"],["Period 6","1:01","1:39"]]);
SCH.mn=mk([["Period 0","7:19","7:52"],["Period 1","8:14","8:47"],["Period 2","8:51","9:24"],["Period 3","9:28","10:01"],["Period 4","10:05","10:38"],["Extended nutrition","10:38","10:58"],["Period 5","11:02","11:35"],["Period 6","11:39","12:12"]]);
var ORDER=["mf","tt","w","ea","et","mn"],TITLES={mf:"Mon/Fri",tt:"Tue/Thu",w:"Wednesday",ea:"Early release (M/W/F)",et:"Early release (T/Th)",mn:"Minimum day"};
var DATES={ea:"Aug 21, Mar 19",et:"Oct 6, Oct 8, Oct 27, Feb 23, Mar 18",mn:"Aug 5, Nov 20, Dec 17–18, Mar 26, May 26–28"};
var SPECIAL={"2026-08-21":"ea","2027-03-19":"ea","2026-10-06":"et","2026-10-08":"et","2026-10-27":"et","2027-02-23":"et","2027-03-18":"et","2026-08-05":"mn","2026-11-20":"mn","2026-12-17":"mn","2026-12-18":"mn","2027-03-26":"mn","2027-05-26":"mn","2027-05-27":"mn","2027-05-28":"mn"};
var DAYK=[null,"mf","tt","w","tt","mf",null];
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var $=function(i){return document.getElementById(i)};
var sel=null;
function fmt(m){var h=Math.floor(m/60)%12||12,mm=m%60;return h+":"+(mm<10?"0":"")+mm}
function p2(n){return n<10?"0"+n:""+n}
function cd(sec){var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h>0?h+":"+p2(m)+":"+p2(s):m+":"+p2(s)}
function tick(){
  var d=new Date(),di=typeof sel==="number"?sel:d.getDay(),k=typeof sel==="string"?sel:sel===null?(SPECIAL[d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())]||DAYK[di]):DAYK[di],now=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
  var name,clock,sub,pct=0,range="",next="",cur=-1;
  $("day").textContent=(sel===null?"":"Previewing ")+(typeof sel==="string"?"":DAYS[di]+(k?", ":""))+(k?TITLES[k]+" schedule":"");
  if(!k){
    name="No school today";clock=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});sub="Classes resume Monday at 7:20";
  }else{
    var S=SCH[k],first=S[0],last=S[S.length-1];
    cur=S.findIndex(function(b){return now>=b.s*60&&now<b.e*60});
    if(cur>=0){
      var b=S[cur];
      name=b.n;clock=cd(b.e*60-now);sub="left in this period";
      pct=(now-b.s*60)/((b.e-b.s)*60);
      range=fmt(b.s)+"–"+fmt(b.e);
      next=S[cur+1]?"Next: "+S[cur+1].n+" at "+fmt(S[cur+1].s):"Last period of the day";
    }else if(now<first.s*60){
      name="Before school";clock=cd(first.s*60-now);sub="until "+first.n+" starts";
      next=first.n+" at "+fmt(first.s);
    }else if(now>=last.e*60){
      name="School’s out";clock=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});sub="See you tomorrow";
    }else{
      var ni=S.findIndex(function(b){return b.s*60>now}),n=S[ni],pv=S[ni-1];
      var gap=n.s-pv.e;
      name=gap<=6?"Passing period":"Break";
      clock=cd(n.s*60-now);sub="until "+n.n+" starts";
      pct=(now-pv.e*60)/(gap*60);
      range=fmt(pv.e)+"–"+fmt(n.s);next="Next: "+n.n;
    }
  }
  $("tnow").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"});$("name").textContent=name;$("clock").textContent=clock;$("sub").textContent=sub;
  $("fill").style.width=Math.max(0,Math.min(1,pct))*100+"%";
  $("range").textContent=range;$("next").textContent=next;
  document.title=k&&cur>=0?clock+" – "+name:"Bell schedule";
  var ch="";
  ORDER.forEach(function(x){
    ch+="<section class=\"sched"+(x===k?" today":"")+"\"><h3>"+TITLES[x]+"</h3>"+(DATES[x]?"<p class=\"dates\">"+DATES[x]+"</p>":"")+"<table>";
    SCH[x].forEach(function(b,i){
      ch+="<tr"+(x===k&&i===cur?" class=\"now\"":"")+"><th scope=\"row\">"+b.n+"</th><td>"+fmt(b.s)+"–"+fmt(b.e)+"</td></tr>";
    });
    ch+="</table></section>";
  });
  $("chart").innerHTML=ch;
}
var btns=document.querySelectorAll("#days button");
btns.forEach(function(b){b.addEventListener("click",function(){
  var v=b.getAttribute("data-d");sel=v==="live"?null:isNaN(+v)?v:+v;
  btns.forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
  tick();
})});
document.querySelectorAll(".sw").forEach(function(s){s.addEventListener("click",function(){
  var on=s.getAttribute("aria-checked")!=="true";
  s.setAttribute("aria-checked",on?"true":"false");
  document.body.classList.toggle("fx-"+s.getAttribute("data-fx"),on);
  document.body.classList.toggle("fx-dark",!!document.querySelector(".sw[data-fx=fog][aria-checked=true],.sw[data-fx=rave][aria-checked=true]"));
  skin();
})});
var theme="navy",hue=215,VARS=["--band","--bg","--col","--line","--ink","--muted","--hl","--brass","--onbrass"];
function skin(){
  var b=document.body,s=b.style;
  b.setAttribute("data-skin",theme);
  VARS.forEach(function(p){s.removeProperty(p)});
  if(theme==="custom"){
    var h=hue,c=(h+180)%360,dk=b.classList.contains("fx-dark");
    var v=dk?["hsl("+h+" 55% 12%)","hsl("+h+" 40% 6%)","hsl("+h+" 40% 11%)","hsl("+h+" 30% 22%)","hsl("+h+" 30% 93%)","hsl("+h+" 20% 72%)","hsl("+c+" 60% 22%)"]:["hsl("+h+" 55% 22%)","hsl("+h+" 45% 96%)","hsl("+h+" 45% 90%)","hsl("+h+" 30% 82%)","hsl("+h+" 55% 14%)","hsl("+h+" 18% 38%)","hsl("+c+" 95% 86%)"];
    v.push("hsl("+c+" 90% 62%)","hsl("+h+" 60% 12%)");
    VARS.forEach(function(p,i){s.setProperty(p,v[i])});
  }
  document.querySelectorAll("#themes button").forEach(function(x){x.setAttribute("aria-checked",x.getAttribute("data-t")===theme?"true":"false")});
  $("hueRow").hidden=theme!=="custom";
}
document.querySelectorAll("#themes button").forEach(function(x){x.addEventListener("click",function(){theme=x.getAttribute("data-t");skin()})});
$("hue").addEventListener("input",function(){hue=+this.value;theme="custom";skin()});
$("reset").addEventListener("click",function(){
  theme="navy";hue=215;$("hue").value=215;sel=null;
  document.querySelectorAll(".sw").forEach(function(s){s.setAttribute("aria-checked","false")});
  ["fx-fog","fx-rave","fx-text","fx-comic","fx-dark"].forEach(function(c){document.body.classList.remove(c)});
  btns.forEach(function(x){x.setAttribute("aria-pressed",x.getAttribute("data-d")==="live"?"true":"false")});
  skin();tick();
});
tick();setInterval(tick,1000);
</script>
